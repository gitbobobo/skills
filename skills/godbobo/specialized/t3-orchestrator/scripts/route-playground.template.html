<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<style>
  :root {
    color-scheme: dark;
    /* file:// 直接打开时的兜底；html_render 会注入真实主题变量覆盖 */
    --fb-background: #131316; --fb-foreground: #e4e4e7; --fb-muted-foreground: #8b8b94;
    --fb-card: #1b1b1f; --fb-secondary: #232327; --fb-border: #333339;
    --fb-primary: #4c8dff; --fb-primary-foreground: #fff;
    --fb-success: #3fb950; --fb-destructive: #f47067; --fb-warning: #e2b93b; --fb-info: #6cb8f0;
  }
  body { font: 12.5px/1.5 var(--font-sans, -apple-system, sans-serif); color: var(--foreground, var(--fb-foreground)); background: var(--background, var(--fb-background)); margin: 0; padding: 14px 0; }
  .wrap { display: grid; grid-template-columns: 240px 1fr; gap: 14px; }
  h3 { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted-foreground, var(--fb-muted-foreground)); margin: 14px 0 6px; }
  h3:first-child { margin-top: 0; }
  label { display: block; margin: 3px 0; cursor: pointer; }
  select, input[type=date] { width: 100%; background: var(--input, var(--card, var(--fb-card))); color: var(--foreground, var(--fb-foreground)); border: 1px solid var(--border, var(--fb-border)); border-radius: var(--radius, 6px); padding: 3px 6px; font: inherit; }
  .ctl { margin-bottom: 8px; }
  .poolgrid label, .provgrid label { display: flex; align-items: center; gap: 6px; margin: 2px 0; }
  .poolgrid select { flex: 1; min-width: 0; padding: 1px 4px; font-size: 11.5px; }
  .poolgrid .pid { width: 82px; font-family: var(--font-mono, monospace); font-size: 11px; color: var(--muted-foreground, var(--fb-muted-foreground)); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .provgrid input { accent-color: var(--primary, var(--fb-primary)); }
  .provgrid .pid { font-family: var(--font-mono, monospace); font-size: 11px; }
  .provgrid .note { color: var(--warning, #e2b93b); font-size: 11px; margin-left: auto; }
  .row { display: flex; align-items: baseline; gap: 8px; padding: 4px 8px; border-radius: 6px; cursor: pointer; border: 1px solid transparent; flex-wrap: wrap; }
  .row:hover { background: var(--accent-surface, var(--secondary, var(--fb-secondary))); }
  .row .n { width: 18px; color: var(--muted-foreground, var(--fb-muted-foreground)); font-size: 11px; text-align: right; flex: none; }
  .row .tgt { font-family: var(--font-mono, monospace); font-size: 11.5px; white-space: nowrap; }
  .row .tgt b { font-weight: 600; }
  .row .pv { color: var(--muted-foreground, var(--fb-muted-foreground)); }
  .tag { font-size: 10px; padding: 0 5px; border-radius: 4px; border: 1px solid var(--border, var(--fb-border)); color: var(--muted-foreground, var(--fb-muted-foreground)); white-space: nowrap; }
  .tag.pool { color: var(--info, #6cb8f0); }
  .tag.via { color: var(--muted-foreground, var(--fb-muted-foreground)); }
  .tag.opt { font-family: var(--font-mono, monospace); color: var(--accent-foreground, var(--primary, var(--fb-primary))); }
  .row.pick { border-color: var(--success, #3fb950); background: color-mix(in srgb, var(--success, #3fb950) 10%, transparent); }
  .row.pick .tgt b { color: var(--success, #3fb950); }
  .row.skip { opacity: .55; cursor: default; }
  .row.skip:hover { background: none; }
  .row.skip .tgt { text-decoration: line-through; }
  .row.excluded { opacity: .4; }
  .row.excluded .tgt { text-decoration: line-through; }
  .reason { color: var(--destructive, #f47067); font-size: 11px; }
  .pickbox { border: 1px solid var(--success, #3fb950); border-radius: 8px; padding: 8px 12px; margin-bottom: 10px; }
  .pickbox .tgt { font-family: var(--font-mono, monospace); font-size: 13px; font-weight: 600; }
  .pickbox pre { margin: 6px 0 0; font-size: 11px; background: var(--code-background, var(--secondary, var(--fb-secondary))); padding: 6px 8px; border-radius: 6px; overflow-x: auto; color: var(--code-foreground, var(--foreground, var(--fb-foreground))); }
  .none { border-color: var(--destructive, #f47067); }
  .warnline { color: var(--warning, #e2b93b); font-size: 11.5px; margin: 4px 0; }
  .sepgroup { margin: 10px 0 4px; font-size: 11px; color: var(--muted-foreground, var(--fb-muted-foreground)); border-top: 1px dashed var(--border, var(--fb-border)); padding-top: 8px; }
  .chips { display: flex; flex-wrap: wrap; gap: 4px; margin: 4px 0; }
  .chip { font-family: var(--font-mono, monospace); font-size: 10.5px; background: var(--secondary, var(--fb-secondary)); border: 1px solid var(--border, var(--fb-border)); border-radius: 10px; padding: 1px 8px; cursor: pointer; }
  .chip:hover { border-color: var(--destructive, var(--fb-destructive)); color: var(--destructive, var(--fb-destructive)); }
  .modebar { display: flex; gap: 6px; margin-bottom: 8px; }
  .modebar button { flex: 1; background: var(--secondary, var(--fb-secondary)); color: var(--secondary-foreground, var(--foreground, var(--fb-foreground))); border: 1px solid var(--border, var(--fb-border)); border-radius: 6px; padding: 4px 0; font: inherit; cursor: pointer; }
  .modebar button.on { background: var(--primary, var(--fb-primary)); color: var(--primary-foreground, var(--fb-primary-foreground)); border-color: var(--primary, var(--fb-primary)); }
  .legtitle { font-size: 11px; color: var(--info, #6cb8f0); margin: 8px 0 2px; font-weight: 600; }
  .foot { margin-top: 12px; font-size: 11px; color: var(--muted-foreground, var(--fb-muted-foreground)); border-top: 1px solid var(--border, var(--fb-border)); padding-top: 8px; }
</style>
</head>
<body>
<div class="wrap">
  <div>
    <div class="modebar">
      <button id="mAuto" class="on">自动 select</button>
      <button id="mNamed">点名 named</button>
    </div>
    <div class="ctl" id="taskCtl">
      <h3>任务 --task</h3>
      <select id="task"></select>
      <label><input type="checkbox" id="hard"> 难题 --hard（顾问→实现）</label>
      <label><input type="checkbox" id="vision"> --vision（视觉类顾问）</label>
      <div class="ctl"><h3>审查 --implementer</h3><select id="implementer"><option value="">（不指定）</option></select></div>
    </div>
    <div class="ctl" id="namedCtl" style="display:none">
      <h3>点名模型</h3>
      <select id="namedModel"></select>
      <h3>限定 harness</h3>
      <select id="namedProvider"><option value="">（按入口优先级）</option></select>
    </div>
    <h3>swe-2 免费期至</h3>
    <div class="ctl"><input type="date" id="swe2free"></div>
    <h3>实例可用（canRunChildTask）</h3>
    <div class="ctl provgrid" id="provs"></div>
    <h3>池状态</h3>
    <div class="ctl poolgrid" id="pools"></div>
    <h3>已试入口 --exclude <a href="#" id="exclClear" style="font-weight:400;text-transform:none;letter-spacing:0">清空</a></h3>
    <div class="chips" id="exclChips"></div>
    <div class="foot">沙盒镜像 route.mjs 的展开与过滤逻辑；权威输出以 <code>route.mjs</code> 为准。<br>点击右侧候选行可把它标记为「已试」。</div>
  </div>
  <div id="out"></div>
</div>
<script id="route-data" type="application/json">__ROUTE_DATA__</script>
<script id="caps-data" type="application/json">__CAPS__</script>
<script id="quota-data" type="application/json">__QUOTA__</script>
<script>
const DATA = JSON.parse(document.getElementById('route-data').textContent);
const CAPS = JSON.parse(document.getElementById('caps-data').textContent);
const QUOTA = JSON.parse(document.getElementById('quota-data').textContent);
const {MODELS, ROUTES, DOWNGRADE, POOLS, PROVIDER_RULES, BANNED_PROVIDERS, MODEL_BANS, TASKS, QUOTA_BLOCK_PERCENT, QUOTA_BLOCK_RESET_MS, MAX_ATTEMPTS} = DATA;
const NOW = Date.now();

// ---------- UI 状态 ----------
const S = {
  mode: 'auto', task: 'implementation', hard: false, vision: false, implementer: '',
  named: '', namedProvider: '', swe2Until: DATA.SWE2_FREE_UNTIL,
  provOff: new Set(),           // 勾选掉 = canRunChildTask false
  poolState: {},                // poolId -> ok|quota|cooldown|recovery
  excluded: new Set(),
};
const PROVS = Object.keys(POOLS).length ? [...new Set(Object.values(MODELS).flatMap(m=>m.entries.map(e=>e.provider)))] : [];
const capsMap = Object.fromEntries(CAPS.providers.map(p=>[p.id,p]));
// 默认按真实 caps/quota 初始化
for (const p of PROVS) if (capsMap[p] && capsMap[p].canRunChildTask === false) S.provOff.add(p);
for (const [pid,def] of Object.entries(POOLS)) {
  const row = QUOTA.find(r=>r.key===def.quotaKey);
  const blocked = row?.windows?.some(w=>def.windows.includes(w.label) && Number(w.usedPercent)>=QUOTA_BLOCK_PERCENT && w.resetMs-NOW>QUOTA_BLOCK_RESET_MS);
  S.poolState[pid] = blocked ? 'quota' : 'ok';
}

// ---------- 逻辑镜像（与 route.mjs 相同） ----------
const entryId = e => `${e.provider}/${e.id}`;
function expandCandidates(cands, stream, seen, via) {
  for (const cand of cands) {
    const m = MODELS[cand.model]; if (!m) continue;
    const primary = cand.provider ? m.entries.find(e=>e.provider===cand.provider) : m.entries[0];
    const ordered = primary ? [primary, ...m.entries.filter(e=>e!==primary)] : [...m.entries];
    ordered.forEach((e,i)=>{
      const k = entryId(e); if (seen.has(k)) return; seen.add(k);
      stream.push({model:cand.model, family:m.family, status:m.status, vision:m.vision===true,
        provider:e.provider, id:e.id, options:{...(e.options||{}), ...(i===0?(cand.options||{}):{})},
        pool:e.pool, via:i===0?(cand.via??via):'same-model', leg:cand.leg});
    });
  }
}
function expandRoute(taskKey) {
  const stream=[]; const seen=new Set(); const seenTasks=new Set();
  const visit=(key,via)=>{ if(seenTasks.has(key))return; seenTasks.add(key);
    expandCandidates(ROUTES[key]||[],stream,seen,via); const d=DOWNGRADE[key]; if(d)visit(d,'downgrade'); };
  visit(taskKey,'route'); return stream;
}
function swe2Free(){ return NOW < Date.parse(S.swe2Until); }
function injectOptions(item){
  const options={...(item.options||{})};
  if (item.provider==='acpRegistry_factory_droid' && options.autonomy_level===undefined) options.autonomy_level='auto-high';
  const info=capsMap[item.provider];
  const hasFast=(info?.models.find(m=>m.id===item.id)?.options||[]).includes('fastMode');
  if (hasFast && options.fastMode===undefined) options.fastMode=false;
  return options;
}
function gateEntry(item,named){
  const reasons=[];
  if (item.status==='named'&&!named) reasons.push('仅限用户点名');
  if (BANNED_PROVIDERS[item.provider]) reasons.push(`${item.provider} ${BANNED_PROVIDERS[item.provider]}`);
  const rule=PROVIDER_RULES[item.provider];
  if (rule?.allowModels && !rule.allowModels.includes(item.id) && !(named&&rule.namedExempt)) reasons.push(`${item.provider} 白名单仅 ${rule.allowModels.join(' / ')}`);
  const info=capsMap[item.provider];
  if (!info) reasons.push('实例不在 capabilities 清单');
  else if (S.provOff.has(item.provider)) reasons.push('实例不可派子任务'+(info.constraints?.length?`（${info.constraints.join('; ')}）`:''));
  else if (!info.models.some(m=>m.id===item.id)) reasons.push('该实例模型清单无此 ID');
  const ps = S.poolState[item.pool];
  if (ps==='cooldown') reasons.push('池冷却中');
  if (ps==='quota' && !(item.model==='swe-2'&&swe2Free())) {
    const def=POOLS[item.pool], row=QUOTA.find(r=>r.key===def?.quotaKey);
    const w=row?.windows?.find(x=>def.windows.includes(x.label)&&Number(x.usedPercent)>=QUOTA_BLOCK_PERCENT&&x.resetMs-NOW>QUOTA_BLOCK_RESET_MS);
    reasons.push(`额度池 ${item.pool} ${w?`${w.label} ${Math.round(w.usedPercent)}%，${new Date(w.resetMs).toISOString().slice(0,13)}Z 重置`:''}`);
  }
  return reasons;
}
function finalize(item){
  const recovery = S.poolState[item.pool]==='recovery';
  return {providerInstanceId:item.provider, model:item.id, modelKey:item.model, family:item.family,
    options:injectOptions(item), pool:item.pool??null, via:item.via, needsRecovery:recovery,
    swe2FreeExempt:(item.model==='swe-2'&&swe2Free())||undefined};
}
function resolveModel(q){
  q=String(q).toLowerCase();
  for (const [key,m] of Object.entries(MODELS)) {
    const ids=m.entries.map(e=>e.id.toLowerCase());
    if (key.toLowerCase()===q||m.label.toLowerCase()===q||ids.includes(q)) return {key,...m};
  }
  for (const [key,m] of Object.entries(MODELS)) {
    const ids=m.entries.map(e=>e.id.toLowerCase());
    if (key.toLowerCase().includes(q)||ids.some(i=>i.includes(q))||m.label.toLowerCase().includes(q)) return {key,...m};
  }
  return null;
}
function taskStream(){
  const task=S.task;
  if (task==='security'){
    const fallback=(ROUTES[DOWNGRADE.security]||[]).map(c=>({...c,via:'downgrade'}));
    const legs=[...new Set(ROUTES.security.map(c=>c.leg||'main'))];
    return legs.map(leg=>{
      const stream=[]; expandCandidates([...ROUTES.security.filter(c=>(c.leg||'main')===leg),...fallback],stream,new Set(),'route');
      return {leg, stream};
    });
  }
  let stream=expandRoute(task);
  if (task==='review'&&S.implementer){
    const impl=resolveModel(S.implementer);
    if (impl) stream=[...stream.filter(i=>i.family!==impl.family),...stream.filter(i=>i.family===impl.family)];
  }
  if (S.vision) stream=[...stream.filter(i=>i.vision),...stream.filter(i=>!i.vision)];
  if (task==='implementation'&&S.hard){
    const adv=expandRoute('advisor');
    const advFiltered=S.vision?[...adv.filter(i=>i.vision),...adv.filter(i=>!i.vision)]:adv;
    return [{leg:'advisor',stream:advFiltered},{leg:'implementation',stream}];
  }
  return [{leg:null,stream}];
}
function namedStream(){
  const m=MODELS[S.named];
  if(!m) return [{leg:null,stream:[]}];
  const entries=S.namedProvider?m.entries.filter(e=>e.provider===S.namedProvider):m.entries;
  const stream=[]; const seen=new Set();
  for(const e of entries){ const k=entryId(e); if(seen.has(k))continue; seen.add(k);
    stream.push({model:S.named,family:m.family,status:m.status,vision:m.vision===true,provider:e.provider,id:e.id,options:{...e.options},pool:e.pool,via:'named'}); }
  return [{leg:null,stream}];
}

// ---------- 渲染 ----------
const $=id=>document.getElementById(id);
function esc(s){return String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}
function optTags(item){
  const o=injectOptions(item); const t=Object.entries(o).map(([k,v])=>`<span class="tag opt">${esc(k)}=${esc(v)}</span>`).join('');
  return t?`<span style="display:inline-flex;gap:3px">${t}</span>`:'';
}
function rowHtml(item,i,status){
  const cls=status==='pick'?'row pick':status==='skip'?'row skip':status==='excl'?'row excluded':'row';
  const res=item.reasons?.length?`<span class="reason">${esc(item.reasons.join('；'))}</span>`:'';
  const tag=item.status&&item.status!=='auto'?`<span class="tag">${item.status}</span>`:'';
  return `<div class="${cls}" data-e="${esc(entryId(item))}"><span class="n">${i+1}</span><span class="tgt"><span class="pv">${esc(item.provider)}</span> / <b>${esc(item.id)}</b></span><span class="tag pool">${esc(item.pool||'-')}</span><span class="tag via">${esc(item.via)}</span>${tag}${optTags(item)}${res}</div>`;
}
function render(){
  const out=$('out');
  // named 状态提示
  let html='';
  if (S.mode==='named'&&MODELS[S.named]?.status!=='named') html+=`<div class="warnline">WARN ${esc(MODELS[S.named]?.label??S.named)} 状态是 ${MODELS[S.named]?.status}，不是点名专用</div>`;
  if (S.mode==='auto'&&S.implementer&&S.task==='review'){const impl=resolveModel(S.implementer); if(impl)html+=`<div class="warnline"># 实现者 ${esc(impl.label)}（${impl.family}）：审查优先选不同家族</div>`;}
  const overCap=S.excluded.size>=MAX_ATTEMPTS;
  const groups=taskOrNamedGroups();
  let stepIdx=0;
  if(overCap)html+=`<div class="pickbox none"><div class="tgt">已试 ${S.excluded.size} 个入口，超过单任务 ${MAX_ATTEMPTS} 次上限</div><div style="font-size:11px;color:var(--muted-foreground, var(--fb-muted-foreground))">停下向用户报告每次尝试的入口和失败原因（脚本 exit 1）</div></div>`;
  for(const g of groups){
    const stream=g.stream.filter(i=>!S.excluded.has(entryId(i)));
    const skipped=[],avail=[];
    for(const item of stream){const r=gateEntry(item,S.mode==='named'); if(r.length)skipped.push({...item,reasons:r});else avail.push(item);}
    g.avail=avail;g.skipped=skipped;g.pick=avail[0]??null;
    if(groups.length>1){const label=g.leg==='advisor'?'顾问咨询 design':g.leg==='implementation'?'实现 implementation':g.leg==='review'?'安全审查 review':g.leg==='crosscheck'?'交叉复核 review':g.leg;html+=`<div class="legtitle">STEP ${++stepIdx} · ${esc(label)}</div>`;}
    if(g.pick&&!overCap){html+=`<div class="pickbox"><div class="tgt">PICK <span class="pv">${esc(g.pick.provider)}</span> / ${esc(g.pick.id)}</div><pre>${esc(JSON.stringify({providerInstanceId:g.pick.provider,model:g.pick.id,options:injectOptions(g.pick)},null,1))}</pre></div>`;}
    else if(!overCap)html+=`<div class="pickbox none"><div class="tgt">无可用候选</div><div style="font-size:11px;color:var(--muted-foreground, var(--fb-muted-foreground))">看下方 SKIPPED 原因；不要绕开脚本自己挑</div></div>`;
    html+=g.stream.map((it,i)=>{
      if(S.excluded.has(entryId(it)))return rowHtml({...it,reasons:['已试（--exclude）']},i,'excl');
      const r=gateEntry(it,S.mode==='named');
      if(r.length)return rowHtml({...it,reasons:r},i,'skip');
      return rowHtml(it,i,it===g.pick?'pick':'alt');
    }).join('');
  }
  out.innerHTML=html;
  const chips=$('exclChips');
  chips.innerHTML=[...S.excluded].map(id=>`<span class="chip" data-e="${esc(id)}">${esc(id)} ×</span>`).join('')||'<span style="color:var(--muted-foreground, var(--fb-muted-foreground));font-size:11px">（点击右侧候选行添加）</span>';
  chips.querySelectorAll('.chip').forEach(c=>c.addEventListener('click',()=>{S.excluded.delete(c.dataset.e);render();}));
  out.querySelectorAll('.row[data-e]').forEach(el=>el.addEventListener('click',()=>{
    const id=el.dataset.e;
    if(S.excluded.has(id))S.excluded.delete(id);else S.excluded.add(id);
    render();
  }));
}
function taskOrNamedGroups(){return S.mode==='named'?namedStream():taskStream();}

// ---------- 控件 ----------
function init(){
  const taskSel=$('task');for(const[k,v]of Object.entries(TASKS)){const o=document.createElement('option');o.value=k;o.textContent=`${k} — ${v}`;taskSel.appendChild(o);}taskSel.value=S.task;
  const implSel=$('implementer');for(const[k,m]of Object.entries(MODELS)){const o=document.createElement('option');o.value=k;o.textContent=m.label;implSel.appendChild(o);}
  const nmSel=$('namedModel');for(const[k,m]of Object.entries(MODELS)){const o=document.createElement('option');o.value=k;o.textContent=`${m.label}（${m.status}）`;nmSel.appendChild(o);}nmSel.value='gpt-6-astra';S.named='gpt-6-astra';
  const npSel=$('namedProvider');for(const p of PROVS){const o=document.createElement('option');o.value=p;o.textContent=p;npSel.appendChild(o);}
  const pg=$('provs');for(const p of PROVS){const c=capsMap[p];pg.innerHTML+=`<label><input type="checkbox" data-p="${esc(p)}" ${S.provOff.has(p)?'':'checked'}><span class="pid">${esc(p)}</span>${c&&c.canRunChildTask===false?`<span class="note" title="${esc((c.constraints||[]).join(';'))}">实时不可用</span>`:''}</label>`;}
  const pl=$('pools');for(const pid of Object.keys(POOLS)){pl.innerHTML+=`<label><span class="pid">${esc(pid)}</span><select data-pool="${esc(pid)}"><option value="ok">正常</option><option value="quota">额度≥90%&>24h</option><option value="cooldown">冷却中</option><option value="recovery">待恢复探测</option></select></label>`;}
  pl.querySelectorAll('select').forEach(s=>{s.value=S.poolState[s.dataset.pool];s.addEventListener('change',()=>{S.poolState[s.dataset.pool]=s.value;render();});});
  pg.querySelectorAll('input').forEach(cb=>cb.addEventListener('change',()=>{cb.checked?S.provOff.delete(cb.dataset.p):S.provOff.add(cb.dataset.p);render();}));
  $('swe2free').value=S.swe2Until;$('swe2free').addEventListener('change',e=>{S.swe2Until=e.target.value;render();});
  taskSel.addEventListener('change',e=>{S.task=e.target.value;render();});
  $('hard').addEventListener('change',e=>{S.hard=e.target.checked;render();});
  $('vision').addEventListener('change',e=>{S.vision=e.target.checked;render();});
  implSel.addEventListener('change',e=>{S.implementer=e.target.value;render();});
  nmSel.addEventListener('change',e=>{S.named=e.target.value;render();});
  npSel.addEventListener('change',e=>{S.namedProvider=e.target.value;render();});
  $('mAuto').addEventListener('click',()=>{S.mode='auto';$('mAuto').classList.add('on');$('mNamed').classList.remove('on');$('taskCtl').style.display='';$('namedCtl').style.display='none';render();});
  $('mNamed').addEventListener('click',()=>{S.mode='named';$('mNamed').classList.add('on');$('mAuto').classList.remove('on');$('taskCtl').style.display='none';$('namedCtl').style.display='';render();});
  $('exclClear').addEventListener('click',e=>{e.preventDefault();S.excluded.clear();render();});
}
init();render();
// 自测：把各任务的 PICK 打到 console，与 route.mjs select 输出对照
try{
  const save={...S,provOff:new Set(S.provOff),poolState:{...S.poolState},excluded:new Set()};
  for(const t of Object.keys(TASKS)){
    S.mode='auto';S.task=t;S.hard=false;S.vision=false;S.implementer='';
    const groups=taskStream();
    const line=groups.map(g=>{const a=g.stream.filter(i=>!gateEntry(i,false).length);return (g.leg?g.leg+':':'')+(a[0]?a[0].provider+'/'+a[0].id:'NONE');}).join(' + ');
    console.log('SELFTEST select',t,'→',line);
  }
  for(const nm of ['gpt-6-astra','fable-5.1','kimi-k3','grok-4.7']){
    S.mode='named';S.named=nm;S.namedProvider='';
    const g=namedStream()[0];const a=g.stream.filter(i=>!gateEntry(i,true).length);
    console.log('SELFTEST named',nm,'→',a[0]?a[0].provider+'/'+a[0].id:'NONE');
  }
  Object.assign(S,save);
}catch(e){console.log('SELFTEST ERROR',e.message,e.stack);}
